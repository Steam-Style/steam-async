[project]
name = "steam-python"
version = "0.0.1"
description = "A fast and lightweight Python interface for interacting with Steam asynchronously."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "grpcio-tools>=1.83.0",
    "mypy-protobuf>=5.1.0",
    "pylint (>=4.0.4,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.1,<10.0.0)",
    "mkdocstrings[python] (>=1.0.0,<2.0.0)",
]

[project.urls]
"Homepage" = "https://python.steam.style"
"Bug Tracker" = "https://github.com/Steam-Style/steam/issues"

[build-system]
requires = ["hatchling>=1.31.0", "grpcio-tools>=1.83.0", "mypy-protobuf>=5.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hooks.py"

[tool.pylint.main]
ignore = ["CVS", "protobufs", "enums"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring", "unused-argument"]
